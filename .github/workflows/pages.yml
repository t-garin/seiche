name: Deploy docs to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install uv
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: uv run --group docs pyan3 -m src/seiche/ --module-level --svg > docs/files_call_graph.svg
      - run: uv run --group docs tools/_seiche_config_builder_to_mkdocs.py
      - run: uv run --group docs mkdocs build --site-dir public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
