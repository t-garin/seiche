generate_hazard:
  - source: slf
    expected_keys: [lf, lf_from_freesurf]
  - source: bfm
    expected_keys: [simple_a]
  - source: hvt
    expected_keys: [hvt]
  - source: unknown
    raises: ValueError
    match: "should be 'bfm', 'slf' or 'hvt'"
generate_hazard_from_bands:
  - fillna0: true
    expected_all_zero: true
  - fillna0: false
    expected_all_nan: true
generate_slf_hazard:
  - name: both_dmg
    use: {floodam: true, jrc: false}
    expected_keys: [lf, lf_from_freesurf]
    band0_finite: true
  - name: jrc_only
    use: {floodam: false, jrc: true}
    expected_keys: [lf, lf_from_freesurf]
    empty_speed_duration: true
  - name: no_depth
    use: {floodam: true, jrc: false}
    no_depth: true
    expected_keys: [lf, lf_from_freesurf]
    empty_depth: true
  - name: loads_existing
    use: {floodam: true, jrc: false}
    expected_keys: [lf, lf_from_freesurf]
    loads_existing: true
generate_bfm_hazard:
  - name: two_methods
    methods: {"use.defended.simple_a": true, "use.defended.fwdet_l": true}
    expected_keys: [simple_a, fwdet_l]
  - name: reuses_duration
    methods: {}
    expected_keys: [simple_a]
    reuse_duration: true
generate_hvt_hazard:
  - name: happy_path
    expected_keys: [hvt]
    check_bands: true
  - name: jrc_only
    use: {floodam: false, jrc: true}
    expected_keys: [hvt]
    check_bands: true
  - name: rejects_one_band
    n_bands: 1
    raises: ValueError
    match: "3 bands"
  - name: rejects_two_bands
    n_bands: 2
    raises: ValueError
    match: "3 bands"
  - name: loads_existing
    expected_keys: [hvt]
    loads_existing: true
