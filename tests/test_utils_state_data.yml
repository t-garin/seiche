expname:
  - expname: custom_name
    expected: custom_name
  - expname: null
    expected: marmande
epsg:
  - epsg: 3857
    write_poly: false
    expected: 3857
  - epsg: null
    write_poly: true
    expected: 4326
use_variables:
  - floodam: true
    jrc: true
    expected: [true, true, true]
  - floodam: false
    jrc: true
    expected: [true, false, false]
  - floodam: false
    jrc: false
    raises: ValueError
    match: At least one of jrc, floodam
pop_conditions:
  - conditions: {}
    raises: ValueError
    match: non-empty dict
  - conditions: null
    raises: ValueError
    match: non-empty dict
  - conditions: "h > 0"
    raises: ValueError
    match: non-empty dict
  - conditions: {always_true: "True"}
    expected: {always_true: "True"}
get_config:
  - template: true
    overrides: {path.out: out, param.EPSG: 2154}
    expected: {path.out: out, param.EPSG: 2154}
  - template: false
    raises: ValueError
    match: not well formatted
get_config_override:
  - overrides: ["path.inp: /data/inp"]
    expected: {path.inp: "/data/inp"}
  - overrides: ["param.EPSG: 2154"]
    expected: {param.EPSG: 2154}
  - overrides: ["param.cold_run: true"]
    expected: {param.cold_run: true}
  - overrides:
      - 'path.inp.slf: [{nickname: lf, filepath: x.slf, epsg: 2154, xspeedVarname: U, yspeedVarname: V, depthVarname: H, depthThreshold: 0, freesurfVarname: null}]'
    expected:
      path.inp.slf:
        - nickname: lf
          filepath: x.slf
          epsg: 2154
          xspeedVarname: U
          yspeedVarname: V
          depthVarname: H
          depthThreshold: 0
          freesurfVarname: null
  - overrides: ["path.out: /a", "path.out: /b"]
    expected: {path.out: /b}
  - overrides: ["path.inpp: /data/inp"]
    raises: ValueError
    match: unknown config key
  - overrides: ["path.inp"]
    raises: ValueError
    match: "key: value"
hazards:
  - name: none
    overrides: {path.inp.slf: null, path.inp.bfm.root: null, path.inp.hvt: null}
    expected: []
  - name: slf_only
    overrides: {path.inp.slf: [{nickname: lf}], path.inp.bfm.root: null, path.inp.hvt: null}
    expected: [slf]
  - name: bfm_only
    overrides: {path.inp.slf: null, path.inp.bfm.root: floodml, path.inp.hvt: null}
    expected: [bfm]
  - name: hvt_only
    overrides: {path.inp.slf: null, path.inp.bfm.root: null, path.inp.hvt: [{nickname: hvt, filepath: hvt.tif}]}
    expected: [hvt]
  - name: all
    overrides: {path.inp.slf: [{nickname: lf}], path.inp.bfm.root: floodml, path.inp.hvt: [{nickname: hvt, filepath: hvt.tif}]}
    expected: [slf, bfm, hvt]
