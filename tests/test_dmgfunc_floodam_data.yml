sirene:
  - rows:
      - ["a", "1011Z", "A"]
      - ["b", "6411Z", "A"]
      - ["c", "5310Z", "A"]
      - ["d", "1011Z", "F"]
      - ["e", "9999Z", "A"]
    geoms: [[0, 0, 50, 50], [50, 0, 100, 50], [0, 50, 50, 100], [50, 50, 100, 100], [0, 0, 25, 25]]
    expected: ["a", "b", "c"]
  - rows:
      - ["a", "1011Z", "A"]
      - ["b", "9999Z", "A"]
    geoms: [[0, 0, 50, 50], [50, 0, 100, 50]]
    expected: ["a"]
init:
  - key: a
    expected: [wheat, corn, barley, otherCereals, colza, sunflower, otherOleaginous, otherIndustrial, orchard, grapevine, flowerVegetables, fodder, permanentGrasslands, temporaryGrasslands]
  - key: h
    expected_contains: [ise]
  - key: datadir
    expected: floodam
read_precompiled:
  - wrong_hash: true
    raises: RuntimeError
    match: sha256 mismatch
agri_rpg:
  - classes: [wheat, corn, colza, wheat]
    surf_parc: [1.0, 1.0, 1.0, 1.0]
    expected_dmg: [1034.43454655138, 785.646491051679, 785.646491051679, 1034.43454655138]
  - classes: [wheat, wheat, wheat, wheat]
    surf_parc: [1.0, 1.0, 1.0, 1.0]
    nan_depth: true
    expected_len: 3
sirene_rejects:
  - nomenclature: NAFRev1
    raises: ValueError
    match: Only NAFRev2
commercial_rejects:
  - kwargs: {naf: 1, max_depth: 0.5}
    raises: TypeError
  - kwargs: {naf: "1011Z", max_depth: "deep"}
    raises: TypeError
commercial_unknown_functype:
  - naf: "9999Z"
    functype: bogus
    raises: ValueError
    match: neither c nor p
