<h2 id="goal">Goal</h2>
<p>Flood impact = <strong><code>damage_function(hazard, land_cover)</code></strong></p>
<ul>
<li>
<p><strong>Hazard</strong> - description of flood event (depth, speed, duration)</p>
</li>
<li>
<p><strong>Exposure</strong> - land cover (what is flooded) + population (who is flooded)</p>
</li>
<li>
<p><strong>Damage Function</strong> - translate hydrodynamic variables into economic or social damage per land cover class or population category.</p>

<h2 id="what-is-seiche">What is Seiche?</h2>
<p>Seiche turns heterogeneous <strong>flood</strong> model outputs, <strong>land cover</strong> and <strong>population</strong> data into hazard rasters and <strong>socio-economic impact estimates</strong>.</p>
<ul>
<li>
<p>Built to be easily extensible and modulable</p>
</li>
<li>
<p>Testing, documentation, reporting, profiling, gitlab CI/CD</p>
</li>
<li>
<p>Dependencies:</p>
</li>
</ul>
<p><code>dask · exactextract · geopandas · geoviews · hvplot · matplotlib · netcdf4 · pyproj · pysheds · pyyaml · rioxarray · typst · xarray</code></p>

<h2 id="codebase-layout">Codebase layout</h2>
<p><code>src/seiche/</code> — 23 modules · ~5.2k LOC of Python ≥ 3.13 · no subpackages</p>
<table>
<thead>
<tr>
<th>Convention</th>
<th>Role</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>main_*.py</code></td>
<td>pipeline parts (<code>main.py</code> orchestrates)</td>
</tr>
<tr>
<td><code>format_*.py</code></td>
<td>inputs → common formats (DEM · BFM · <code>.slf</code> · landcover)</td>
</tr>
<tr>
<td><code>utils_*.py</code></td>
<td>helpers per data type (state · geom · gdf · enum · da · plot · qol)</td>
</tr>
<tr>
<td><code>affected_population.py</code></td>
<td>affected people (Filosofi · GHSL)</td>
</tr>
<tr>
<td><code>defended.py</code></td>
<td>depth estimation (FwDET · HAND · simple)</td>
</tr>
<tr>
<td><code>maps.py</code></td>
<td>landcover ↔ damage-class correspondence</td>
</tr>
<tr>
<td><code>dmgfunc_floodam.py</code></td>
<td>Floodam damage function</td>
</tr>
<tr>
<td><code>dmgfunc_jrc.py</code></td>
<td>JRC damage function</td>
</tr>
</tbody>
</table>
</section>

<p><strong>Config Builder</strong> (<code>tools/seiche_config_builder.py</code>):<br />
a <code>marimo</code> notebook app, launched with <code>just config</code></p>
</li>
<li>
<p>Validated against <code>src/seiche/config_template.yml</code></p>
</li>
</ul>

<h2 id="known-issues">Known issues</h2>
<ul>
<li>Tests were made on Linux, seems like there are some SHA256 mismatches when on MacOS (not tested on Windows), probably because of file metadata. Seems to be a FWDET issue ?</li>
</ul>
<blockquote>
<p><em><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo>⇒</mo></mrow><annotation encoding="application/x-tex">\Rightarrow</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="katex-base"><span class="katex-strut" style="height:0.3669em;"></span><span class="mrel">⇒</span></span></span></span> Need to extract content, encode to utf-8 string then SHA256? Or Docker?</em></p>
</blockquote>
<ul>
<li>
<p>Some warning I put a long time ago, need to check if they are still relevant and if they hide ill-defined behaviour.</p>
</li>
<li>
<p>Would need to expand automatic plots and reporting.</p>
</li>
</ul>
<hr />
<div class="center v-center">
<p><strong>All and all not perfected, but ready to be peer-reviewed and industrialized!</strong></p>
</div>
